services:
  mcp-proxy:
    build: .
    container_name: mcp-proxy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Обязательно 0.0.0.0 внутри контейнера
      MCP_HOST: "0.0.0.0"
    volumes:
      # Снапшот OAuth2-токенов (MCP_OAUTH2_STORE_PATH=/app/data/oauth2.json).
      # Без этого volume токены теряются при пересоздании контейнера, и все
      # клиенты вынуждены проходить авторизацию заново.
      #
      # Именованный том: права наследуются из образа (владелец node),
      # запись работает из коробки.
      - mcp-data:/app/data
      # Альтернатива — bind-mount каталога хоста (удобнее для бэкапа):
      #   - ./data:/app/data
      # ВАЖНО: процесс в контейнере работает под пользователем node (uid 1000).
      # Если каталог ./data создан root'ом (например, самим Docker при первом
      # запуске), запись снапшота будет молча падать с EACCES, и каждый
      # перезапуск разлогинит всех клиентов. Выполните на хосте:
      #   mkdir -p ./data && chown -R 1000:1000 ./data
    restart: unless-stopped
    # Если 1С на хосте - раскомментируйте для доступа через host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  mcp-data:
